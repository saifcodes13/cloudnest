############################################################
# CloudNest Nginx Configuration
############################################################

pid /home/saif/cloudnest/ngnix/nginx.pid;
error_log /home/saif/cloudnest/ngnix/error.log warn;

worker_processes 1;

events {
    worker_connections 1024;
}

http {

    ########################################################
    # Basic Configuration
    ########################################################

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /home/saif/cloudnest/ngnix/access.log;

    sendfile on;
    keepalive_timeout 65;

    client_max_body_size 100M;

    client_body_temp_path /home/saif/cloudnest/ngnix/client_body;
    proxy_temp_path       /home/saif/cloudnest/ngnix/proxy;
    fastcgi_temp_path     /home/saif/cloudnest/ngnix/fastcgi;
    uwsgi_temp_path       /home/saif/cloudnest/ngnix/uwsgi;
    scgi_temp_path        /home/saif/cloudnest/ngnix/scgi;

    ########################################################
    # Backend Load Balancer
    ########################################################

    upstream cloudnest_backend {

        server 127.0.0.1:5001;
       # server 192.168.1.32:5001;

    }

    ########################################################
    # Hosted Websites
    ########################################################

    server {

        listen 8082;

        server_name ~^(?<subdomain>[a-zA-Z0-9-]+)\.(localhost|cloudcodes\.online)$;

        location / {

            root /home/saif/cloudnest/hosted-sites/$subdomain/active;

            index index.html;

            try_files $uri $uri/ /index.html;

        }

        error_page 404 /404.html;

        location = /404.html {

            default_type text/plain;

            return 404 "Website is active, but the page you are looking for was not found (404).";

        }

    }

    ########################################################
    # CloudNest Dashboard
    ########################################################

    server {

        listen 8082 default_server;

        server_name localhost cloudcodes.online;

        ####################################################
        # Backend API
        ####################################################

        location /api/v1/ {

            proxy_pass http://cloudnest_backend/api/v1/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable buffering for large uploads
            proxy_request_buffering off;
            proxy_buffering off;

            # Increase timeouts for large file uploads
            proxy_connect_timeout 900s;
            proxy_send_timeout 900s;
            proxy_read_timeout 900s;
            client_body_timeout 900s;
            send_timeout 900s;

        }

        ####################################################
        # Hosted Sites Browser
        ####################################################

        location /sites/ {

            alias /home/saif/cloudnest/hosted-sites/;

            index index.html;

        }

        ####################################################
        # React Frontend (Vite Dev Server)
        ####################################################

        location / {

            proxy_pass http://127.0.0.1:5173;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

        }

    }

}