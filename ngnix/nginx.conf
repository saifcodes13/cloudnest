# Nginx User-Space Router Configuration
pid /home/saif/cloudnest/ngnix/nginx.pid;
error_log /home/saif/cloudnest/ngnix/error.log warn;

# The number of worker processes is set to auto or 1 for local environments
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /home/saif/cloudnest/ngnix/access.log;

    # Temp directories needed because non-root users cannot write to default /var/lib/nginx
    client_body_temp_path /home/saif/cloudnest/ngnix/client_body;
    proxy_temp_path /home/saif/cloudnest/ngnix/proxy;
    fastcgi_temp_path /home/saif/cloudnest/ngnix/fastcgi;
    uwsgi_temp_path /home/saif/cloudnest/ngnix/uwsgi;
    scgi_temp_path /home/saif/cloudnest/ngnix/scgi;

    sendfile on;
    keepalive_timeout 65;

    # Subdomain serving server block (Local testing)
    server {
        listen 8082;
        server_name ~^(?<subdomain>[a-zA-Z0-9-]+)\.localhost$;

        location / {
            root /home/saif/cloudnest/hosted-sites/$subdomain/active;
            index index.html;
            try_files $uri $uri/ =404;
        }

        # Handle errors gracefully
        error_page 404 /404.html;
        location = /404.html {
            return 404 "Website is active, but the page you are looking for was not found (404).";
            add_header Content-Type text/plain;
        }
    }

    # Main Gateway block (Forwarding external ngrok/public IP traffic)
    server {
        listen 8082 default_server;
        server_name localhost;

        # 1. Path-based routing fallback for hosted sites (perfect for ngrok free tier!)
        # Map: https://<ngrok-id>.ngrok-free.app/sites/<website-name>/active/ -> files
        location /sites/ {
            alias /home/saif/cloudnest/hosted-sites/;
            index index.html;
        }

        # 2. Proxy API requests to backend Express server
        location /api/v1/ {
            proxy_pass http://127.0.0.1:5001/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Proxy dashboard and web pages to frontend Vite server
        location / {
            proxy_pass http://127.0.0.1:5173;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSockets support (for hot module reloading HMR)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
